<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%"
     role="img" aria-label="Espada-Balança do Acervo Penal">
  <!--
    Espada-Balança oficial — peça vetorial de referência.

    Cores fixas do TEMA ESCURO, iguais às que os tokens entregam ao
    emblema do Hero: metal #D4D4D8 (--platina-fosca), lâmina #D11E5C
    (--vinho-traco) e cabo #881337 (--vinho) sobre ônix #09090B.

    A lâmina não usa o vinho pleno de propósito: sobre o ônix ele dá
    2,08:1 e a espada sumiria. O #D11E5C dá 3,84:1.

    A geometria é a mesma de App.emblemaSVG() em js/app.js, que é a
    fonte de verdade. Mexeu aqui, mexa lá e em tools/gerar-icones.py.
  -->
  <rect width="100" height="100" fill="#09090B"/>

  <!-- Anel Circular da Legalidade Estrita -->
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#D4D4D8" stroke-width="4.8"/>

  <!-- Correntes e pratos da balança -->
  <g stroke="#D4D4D8" stroke-width="1.2" stroke-linecap="round">
    <line x1="24.5" y1="38" x2="14" y2="61.5"/>
    <line x1="24.5" y1="38" x2="36" y2="61.5"/>
    <line x1="75.5" y1="38" x2="64" y2="61.5"/>
    <line x1="75.5" y1="38" x2="86" y2="61.5"/>
  </g>
  <path d="M 13.5,61.5 L 36.5,61.5 C 36.5,61.5 35,66 25,66 C 15,66 13.5,61.5 13.5,61.5 Z" fill="#D4D4D8"/>
  <path d="M 63.5,61.5 L 86.5,61.5 C 86.5,61.5 85,66 75,66 C 65,66 63.5,61.5 63.5,61.5 Z" fill="#D4D4D8"/>

  <!-- A espada: guarda e lâmina em vinho -->
  <path d="M 50,33 C 42,33 32,35.2 24.5,38 C 31,37.8 41,36 47,35 Z" fill="#D11E5C"/>
  <path d="M 50,33 C 58,33 68,35.2 75.5,38 C 69,37.8 59,36 53,35 Z" fill="#D11E5C"/>

  <!-- Finiais da guarda e pomo, em metal -->
  <polygon points="24.5,36.5 26.2,38 24.5,39.5 22.8,38" fill="#D4D4D8"/>
  <polygon points="75.5,36.5 77.2,38 75.5,39.5 73.8,38" fill="#D4D4D8"/>
  <path d="M 50,14.2 L 52.4,17.2 L 50.8,18.8 L 49.2,18.8 L 47.6,17.2 Z" fill="#D4D4D8"/>

  <!-- Cabo: o vinho pleno, lido pelo contorno contra o metal -->
  <rect x="48.5" y="18.8" width="3" height="14.2" rx="1" fill="#881337"/>
  <polygon points="50,31.5 53,34 50,36.5 47,34" fill="#D4D4D8"/>

  <!-- Lâmina -->
  <path d="M 47.5,35 L 49.7,35 L 49.7,71.5 L 50,84.5 L 47.5,69.5 Z" fill="#D11E5C"/>
  <path d="M 52.5,35 L 50.3,35 L 50.3,71.5 L 50,84.5 L 52.5,69.5 Z" fill="#D11E5C"/>
  <line x1="50" y1="35" x2="50" y2="84.5" stroke="#D4D4D8" stroke-width="0.7" opacity="0.7"/>
</svg>
