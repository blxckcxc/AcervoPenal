<script>
/* isSecureContext é verdadeiro sob HTTPS e também em localhost, mas falso
   em file:// — que é onde o navegador recusaria o registro e a tentativa
   sujaria o console, coisa que este projeto não admite. */
if ("serviceWorker" in navigator && window.isSecureContext) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
